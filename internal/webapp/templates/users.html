{{define "content"}}
<h1>用户管理</h1>
<table>
  <tr><th>ID</th><th>用户名</th><th>MFA</th><th>角色</th><th>密钥数</th><th>创建时间</th></tr>
  {{range .Data.Users}}
  <tr>
    <td>{{.ID}}</td>
    <td>{{.Username}}</td>
    <td>{{if .TOTPEnabled}}<span class="dot ok"></span>{{else}}<span class="dot warn"></span>{{end}}</td>
    <td>{{if .IsAdmin}}管理员{{else}}成员{{end}}</td>
    <td>{{.Devices}}</td>
    <td>{{.CreatedAt.Format "2006-01-02 15:04"}}</td>
  </tr>
  {{end}}
</table>
<div class="card">
  <h2>新建账号</h2>
  <form method="post" action="/users/new">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label>用户名（3-32 位字母/数字/_/-）
      <input name="username" required>
    </label>
    <label>初始密码（至少 8 位，请线下告知对方）
      <input type="password" name="password" required minlength="8">
    </label>
    <button type="submit">创建</button>
  </form>
  <p class="muted small">新账号首次登录后需自行绑定 Google Authenticator 才能使用客户端密钥功能。</p>
</div>
{{end}}
