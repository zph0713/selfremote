{{define "content"}}
<div class="card narrow">
  <h1>创建管理员账号</h1>
  <p class="muted">这是本控制面的第一个账号，将成为管理员。之后的新账号需由管理员创建。</p>
  {{if .Data.NeedsToken}}
  <div class="flash warn">这个控制面要求「部署令牌」：它由部署脚本生成，在数据目录的
    <code>bootstrap-token</code> 文件里（<code>docker compose logs web</code> 也会提示）。
    这是为了防止别人在你之前抢注管理员。</div>
  {{end}}
  <form method="post" action="/register">
    <label>用户名（3-32 位字母/数字/_/-）
      <input name="username" autocomplete="username" autofocus required>
    </label>
    <label>密码（至少 8 位）
      <input type="password" name="password" autocomplete="new-password" required>
    </label>
    <label>确认密码
      <input type="password" name="confirm" autocomplete="new-password" required>
    </label>
    {{if .Data.NeedsToken}}
    <label>部署令牌
      <input name="bootstrap" autocomplete="off" required>
    </label>
    {{end}}
    <button type="submit">创建并继续绑定 Google Authenticator</button>
  </form>
</div>
{{end}}
