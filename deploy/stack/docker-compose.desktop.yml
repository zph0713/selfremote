# Docker Desktop 测试覆盖文件：主机网络 → 桥接 + 发布端口
# （Docker Desktop 的 host 网络 = 虚拟机 netns，外部入站与发布端口都会失效）
#
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.desktop.yml up -d
#
# 本机站点（agent-home）在桌面版里跑在 VM 网络里，只能服务 VM 网段；
# 要在桌面机上验证完整链路（client → server → agent → 站点内网）请用
# scripts/e2e-hub.sh（全容器拓扑）。
services:
  server:
    network_mode: bridge
    ports:
      - "${TUNNEL_PORT:-28333}:${TUNNEL_PORT:-28333}/udp"
      - "127.0.0.1:${API_PORT:-8770}:8770"

  agent-home:
    network_mode: bridge
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      # 桥接网络里通过服务名找到中转服务端
      SR_AGENT_SERVER_OVERRIDE: "server:${TUNNEL_PORT:-28333}"
