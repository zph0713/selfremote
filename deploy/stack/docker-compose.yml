# selfremote 全家桶 v0.3：nginx（反代）+ web（控制面）+ mariadb + server（中转）+ agent-home（本机站点）
#
# 拓扑：
#   客户端 ──▶ server（中转，用户态，无特权）──▶ agent-*（各站点，tun + SNAT）──▶ 站点内网
#                    ▲
#              web 控制面（站点管理 / 客户端密钥 / 启停踢线）
#
# 用法（Linux NAS / 任意 Docker 主机）：
#   1. cp .env.example .env && vi .env        # 数据库密码、端口等
#   2. bash init.sh                           # 生成 server.json / 令牌 / 本机站点 agent 配置（幂等）
#   3. docker compose up -d
#   4. 浏览器打开 http://<主机>:8080 → 注册管理员 → 绑定 Google Authenticator
#   5. 在「站点 Agent」页确认本机站点（home）在线；其他站点在那台机器上按部署包接入
#
# Docker Desktop（Windows/macOS 本机试验）：加 -f docker-compose.desktop.yml
#   （桌面版的 host 网络是虚拟机 netns，必须换成桥接 + 发布端口）
name: selfremote

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在 .env 设置 DB_ROOT_PASSWORD}
      MARIADB_DATABASE: selfremote
      MARIADB_USER: sr
      MARIADB_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    image: ${SR_WEB_IMAGE:-ghcr.io/zph0713/selfremote-web:latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DB_DSN: "sr:${DB_PASSWORD}@tcp(db:3306)/selfremote?parseTime=true&charset=utf8mb4"
      DATA_DIR: /data
      LISTEN: ":8080"
      SERVER_ADDR: ${SERVER_ADDR:-}
      LAN_CIDRS: ${LAN_CIDRS:-192.168.1.0/24}
      TUNNEL_PORT: ${TUNNEL_PORT:-28333}
      SRV_API_URL: ${SRV_API_URL:-http://server:8770}
      SRV_API_TOKEN_FILE: /data/api-token
      AGENT_DIST_DIR: /agent-dist
      # 控制面走 HTTPS 时设为 1：会话 Cookie 会带上 Secure（浏览器不再明文发送）
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - ${SR_CONFIG_DIR:-./data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # 主端口（局域网/家庭内访问用）
      - "${HTTP_PORT:-8080}:80"
      # 备用端口：部分家宽会拦截入站的 80/8080/8443 等常见端口，
      # 外网访问不走主端口时可以用这个（也方便改成任意端口）
      - "${HTTP_ALT_PORT:-28080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  # 中转服务端：一个 UDP 端口同时接受客户端与站点 agent，用户态转发。
  # 不需要 TUN / NET_ADMIN / ip_forward —— 只有 host 网络为了拿到宿主的 UDP 端口。
  server:
    image: ${SR_IMAGE:-ghcr.io/zph0713/selfremote:latest}
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${SR_CONFIG_DIR:-./data}:/etc/selfremote
    command: ["server", "-c", "/etc/selfremote/server.json"]

  # 本机站点（NAS 自己所在的内网）：由 init.sh 预置密钥与配置，起来就是在线状态，
  # 不需要登录网页手工建站。不需要这个内网时可删掉本服务。
  agent-home:
    image: ${SR_IMAGE:-ghcr.io/zph0713/selfremote:latest}
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      SR_TUNNEL_CIDR: ${SR_TUNNEL_CIDR:-10.77.0.0/24}
      # 容器里要连宿主上的 server（默认配置写的是 127.0.0.1）
      SR_AGENT_SERVER_OVERRIDE: ${SR_AGENT_SERVER_OVERRIDE:-}
    volumes:
      - ${SR_CONFIG_DIR:-./data}:/etc/selfremote
    command: ["agent", "-c", "/etc/selfremote/agent-home.json"]
    depends_on:
      - server

volumes:
  db-data:
