name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build binaries & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "-s -w" -o "dist/$3" ./cmd/sr
          }
          build darwin  arm64 selfremote-macos-arm64
          build darwin  amd64 selfremote-macos-amd64
          build linux   amd64 selfremote-linux-amd64
          build linux   arm64 selfremote-linux-arm64
          build windows amd64 selfremote-windows-amd64.exe
          ls -la dist

      - name: Package macOS zip
        run: |
          set -euo pipefail
          mkdir -p pkg
          cp dist/selfremote-macos-arm64 dist/selfremote-macos-amd64 pkg/
          cp docs/QUICKSTART-CLIENT.md pkg/README-使用说明.md
          cp deploy/examples/client.json.example pkg/client.json.example
          cp deploy/mac/start.command pkg/双击启动.command
          chmod +x pkg/双击启动.command pkg/selfremote-macos-*
          (cd pkg && zip -r ../dist/selfremote-macos.zip .)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "selfremote $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE-NOTES.md

  image:
    name: Build & push docker image (ghcr.io)
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push multi-arch images (gateway + web)
        run: |
          set -euo pipefail
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f deploy/nas/Dockerfile \
            -t "$IMG:${GITHUB_REF_NAME}" \
            -t "$IMG:latest" \
            --push .
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f deploy/stack/web.Dockerfile \
            -t "$IMG-web:${GITHUB_REF_NAME}" \
            -t "$IMG-web:latest" \
            --push .

      - name: Build amd64 image tars (for offline docker load)
        run: |
          set -euo pipefail
          mkdir -p dist-image
          docker buildx build --platform linux/amd64 --load \
            -f deploy/nas/Dockerfile -t selfremote:release .
          docker save selfremote:release | gzip > dist-image/selfremote-image-linux-amd64.tar.gz
          docker buildx build --platform linux/amd64 --load \
            -f deploy/stack/web.Dockerfile -t selfremote-web:release .
          docker save selfremote-web:release | gzip > dist-image/selfremote-web-image-linux-amd64.tar.gz
          ls -la dist-image

      - name: Upload image tars to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist-image/selfremote-image-linux-amd64.tar.gz \
            dist-image/selfremote-web-image-linux-amd64.tar.gz \
            --clobber
